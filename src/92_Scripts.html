<script>
  /* =========================
   CONFIGURATION PLANNING
   ========================= */

  const days = [
    "Lundi",
    "Mardi",
    "Mercredi",
    "Jeudi",
    "Vendredi",
    "Samedi",
    "Dimanche",
  ];

  const startHour = 7;

  const endHour = 24;

  const pixelsPerHour = 60;

  let planningData = null;

  let selectedGym = null;

  /* =========================
   SIDEBAR
   ========================= */

  const SIDEBAR_STORAGE_KEY = "usab-sidebar-collapsed";

  /**
   * Initialise la sidebar.
   */
  function initializeSidebar() {
    const collapsed = localStorage.getItem(SIDEBAR_STORAGE_KEY) === "true";

    setSidebarCollapsed(collapsed, false);
  }

  /**
   * Réduit ou développe
   * la sidebar.
   */
  function toggleSidebar() {
    const collapsed = !document.body.classList.contains("sidebar-collapsed");

    setSidebarCollapsed(collapsed, true);
  }

  /**
   * Applique l'état.
   */
  function setSidebarCollapsed(collapsed, save) {
    document.body.classList.toggle("sidebar-collapsed", collapsed);

    const button = document.getElementById("sidebar-toggle");

    if (button) {
      button.textContent = collapsed ? "›" : "‹";

      const label = collapsed ? "Développer le menu" : "Réduire le menu";

      button.title = label;

      button.setAttribute("aria-label", label);
    }

    if (save) {
      localStorage.setItem(SIDEBAR_STORAGE_KEY, String(collapsed));
    }
  }

  /**
   * Initialise l'état mémorisé.
   */
  document.addEventListener("DOMContentLoaded", initializeSidebar);

  /* =========================
   NAVIGATION
   ========================= */

  function navigateTo(page) {
    if (currentUser && !currentUser.authorized) {
      return;
    }

    /*
     * La page Accès est réservée
     * aux administrateurs.
     */
    if (page === "access" && (!currentUser || currentUser.role !== "ADMIN")) {
      return;
    }

    /*
     * Cache toutes les pages.
     */

    document.querySelectorAll(".app-page").forEach((element) => {
      element.classList.add("hidden");
    });

    /*
     * Affiche la page demandée.
     */

    const target = document.getElementById("page-" + page);

    if (target) {
      target.classList.remove("hidden");
    }

    /*
     * Met à jour le menu.
     */

    document.querySelectorAll(".menu-item").forEach((element) => {
      element.classList.remove("active");
    });

    const menuItem = document.querySelector('[data-page="' + page + '"]');

    if (menuItem) {
      menuItem.classList.add("active");
    }

    /*
     * Chargement page Accès.
     */

    if (page === "access" && !accessUsersLoaded) {
      loadAccessUsers();
    }

    /*
     * Chargement page Adhésions.
     */

    if (page === "adhesions") {
      loadAdhesions();
    }
    /*
     * Chargement page Arbitrage.
     */

    if (page === "arbitrage") {
      loadArbitrage();
    }

    /*
     * Chargement page Matchs.
     */

    if (page === "matchs") {
      loadMatchsModule();
    }
  }

  /* =========================
   CHARGEMENT PLANNING
   ========================= */

  google.script.run

    .withSuccessHandler(initializePlanning)

    .withFailureHandler(showPlanningError)

    .getPlanningData();

  /* =========================
   INITIALISATION PLANNING
   ========================= */

  function initializePlanning(data) {
    planningData = data;

    const gyms = data.gymnases;

    const select = document.getElementById("gymSelect");

    select.innerHTML = "";

    gyms.forEach((gym) => {
      const option = document.createElement("option");

      option.value = gym.reference;

      option.textContent = gym.nom;

      select.appendChild(option);
    });

    if (gyms.length > 0) {
      selectedGym = gyms[0].reference;

      select.value = selectedGym;
    }

    buildPlanning(planningData);
  }

  /* =========================
   CHANGEMENT GYMNASE
   ========================= */

  function changeGym() {
    selectedGym = document.getElementById("gymSelect").value;

    buildPlanning(planningData);
  }

  /* =========================
   CONSTRUCTION PLANNING
   ========================= */

  function buildPlanning(data) {
    const container = document.getElementById("planning");

    container.innerHTML = "";

    const planning = document.createElement("div");

    planning.className = "planning";

    /*
     * Coin supérieur gauche.
     */

    const corner = document.createElement("div");

    corner.className = "corner";

    planning.appendChild(corner);

    /*
     * Jours.
     */

    days.forEach((day) => {
      const header = document.createElement("div");

      header.className = "header";

      header.textContent = day;

      planning.appendChild(header);
    });

    /*
     * Colonne heures.
     */

    const hours = document.createElement("div");

    for (let hour = startHour; hour < endHour; hour++) {
      const hourDiv = document.createElement("div");

      hourDiv.className = "hour";

      hourDiv.textContent = String(hour).padStart(2, "0") + ":00";

      hours.appendChild(hourDiv);
    }

    planning.appendChild(hours);

    /*
     * Colonnes jours.
     */

    days.forEach((day) => {
      const column = document.createElement("div");

      column.className = "day";

      /*
       * Lignes horaires.
       */

      for (let hour = startHour; hour <= endHour; hour++) {
        const line = document.createElement("div");

        line.className = "hour-line";

        line.style.top = (hour - startHour) * pixelsPerHour + "px";

        column.appendChild(line);
      }

      /*
       * Disponibilités.
       */

      data.disponibilites

        .filter((item) => item.jour === day && item.lieu === selectedGym)

        .forEach((item) => {
          const block = document.createElement("div");

          block.className = "availability";

          positionBlock(block, item.debut, item.fin);

          column.appendChild(block);
        });

      /*
       * Entraînements.
       */

      data.entrainements

        .filter((item) => item.jour === day && item.lieu === selectedGym)

        .forEach((item) => {
          const block = document.createElement("div");

          block.className = "training";

          positionBlock(block, item.debut, item.fin);

          /*
           * Couleur équipe.
           */

          const couleurEquipe = data.couleursEquipes.find(
            (couleur) => couleur.equipe === item.equipe,
          );

          if (couleurEquipe) {
            if (couleurEquipe.couleurFond) {
              block.style.backgroundColor = couleurEquipe.couleurFond;
            }

            if (couleurEquipe.couleurTexte) {
              block.style.color = couleurEquipe.couleurTexte;
            }
          }

          /*
           * Entraîneur.
           */

          const entraineur = getEntraineur(data, item.entraineur);

          let blockContent =
            item.reference +
            "<br>" +
            formatTime(item.debut) +
            " - " +
            formatTime(item.fin);

          if (entraineur) {
            blockContent +=
              '<div class="training-coach">' +
              formatEntraineurName(entraineur) +
              "</div>";
          }

          block.innerHTML = blockContent;

          column.appendChild(block);
        });

      planning.appendChild(column);
    });

    container.appendChild(planning);

    buildSummary(data);
  }

  /* =========================
   POSITION BLOCS
   ========================= */

  function positionBlock(element, start, end) {
    const calendarStart = startHour * 60;

    const top = ((start - calendarStart) / 60) * pixelsPerHour;

    const height = ((end - start) / 60) * pixelsPerHour;

    element.style.top = top + "px";

    element.style.height = height + "px";
  }

  /* =========================
   FORMAT HEURE
   ========================= */

  function formatTime(minutes) {
    if (minutes === 1440) {
      return "00:00";
    }

    const hour = Math.floor(minutes / 60);

    const minute = minutes % 60;

    return (
      String(hour).padStart(2, "0") + ":" + String(minute).padStart(2, "0")
    );
  }

  /* =========================
   FORMAT DUREE
   ========================= */

  function formatDuration(minutes) {
    const hours = Math.floor(minutes / 60);

    const remainingMinutes = minutes % 60;

    if (remainingMinutes === 0) {
      return hours + "h";
    }

    return hours + "h" + String(remainingMinutes).padStart(2, "0");
  }

  /* =========================
   ENTRAINEURS
   ========================= */

  function getEntraineur(data, reference) {
    if (!reference) {
      return null;
    }

    return (
      data.entraineurs.find(
        (entraineur) => entraineur.reference === reference,
      ) || null
    );
  }

  function formatEntraineurName(entraineur) {
    if (!entraineur) {
      return "";
    }

    return [entraineur.prenom, entraineur.nom]

      .filter(Boolean)

      .join(" ");
  }

  /* =========================
   STATISTIQUES
   ========================= */

  function buildSummary(data) {
    const summary = document.getElementById("summary");

    const totalsEquipes = {};

    const totalsEntraineurs = {};

    data.entrainements.forEach((item) => {
      const durationMinutes = item.fin - item.debut;

      /*
       * Equipes.
       */

      if (item.equipe) {
        if (!totalsEquipes[item.equipe]) {
          totalsEquipes[item.equipe] = 0;
        }

        totalsEquipes[item.equipe] += durationMinutes;
      }

      /*
       * Entraîneurs.
       */

      if (item.entraineur) {
        if (!totalsEntraineurs[item.entraineur]) {
          totalsEntraineurs[item.entraineur] = 0;
        }

        totalsEntraineurs[item.entraineur] += durationMinutes;
      }
    });

    /*
     * TABLEAU EQUIPES
     */

    let html = `

    <h2>
      Heures par équipe
    </h2>


    <table class="summary-table">

      <thead>

        <tr>

          <th>
            Équipe
          </th>

          <th>
            Heures
          </th>

        </tr>

      </thead>


      <tbody>

  `;

    Object.entries(totalsEquipes)

      .forEach(([equipe, minutes]) => {
        html += `

          <tr>

            <td>
              ${equipe}
            </td>

            <td>
              ${formatDuration(minutes)}
            </td>

          </tr>

        `;
      });

    html += `

      </tbody>

    </table>


    <h2>
      Heures par entraîneur
    </h2>


    <table class="summary-table">

      <thead>

        <tr>

          <th>
            Entraîneur
          </th>

          <th>
            Heures
          </th>

        </tr>

      </thead>


      <tbody>

  `;

    /*
     * TABLEAU ENTRAINEURS
     */

    Object.entries(totalsEntraineurs)

      .forEach(([reference, minutes]) => {
        const entraineur = getEntraineur(data, reference);

        const displayName = entraineur
          ? formatEntraineurName(entraineur)
          : reference;

        html += `

          <tr>

            <td>
              ${displayName}
            </td>

            <td>
              ${formatDuration(minutes)}
            </td>

          </tr>

        `;
      });

    html += `

      </tbody>

    </table>

  `;

    summary.innerHTML = html;
  }

  /* =========================
   ERREURS PLANNING
   ========================= */

  function showPlanningError(error) {
    document.getElementById("planning").innerHTML =
      "<strong>Erreur :</strong> " + error.message;
  }

  /* =========================
   UTILISATEUR
   ========================= */

  let currentUser = null;

  google.script.run

    .withSuccessHandler(initializeUser)

    .withFailureHandler(showUserError)

    .getCurrentUser();

  function initializeUser(user) {
    currentUser = user;

    console.log("Utilisateur :", user);

    /*
     * Utilisateur non autorisé.
     */

    if (!user.authorized) {
      showUnauthorizedPage(user);

      return;
    }

    /*
     * Affichage utilisateur
     * dans la sidebar.
     */

    displayCurrentUser(user);

    /*
     * Menu Accès :
     * uniquement ADMIN.
     */

    const accessMenu = document.getElementById("menu-access");

    if (accessMenu && user.role === "ADMIN") {
      accessMenu.classList.remove("hidden");
    }
  }

  function displayCurrentUser(user) {
    const container = document.getElementById("sidebar-user");

    if (!container) {
      return;
    }

    container.innerHTML = `

    <div class="sidebar-user-name">
      ${user.prenom} ${user.nom}
    </div>

    <div class="sidebar-user-role">
      ${user.role}
    </div>

  `;
  }

  function showUnauthorizedPage(user) {
    /*
     * Cache toutes les pages.
     */

    document.querySelectorAll(".app-page").forEach((page) => {
      page.classList.add("hidden");
    });

    /*
     * Cache le menu.
     */

    const menu = document.querySelector(".sidebar-menu");

    if (menu) {
      menu.classList.add("hidden");
    }

    /*
     * Cache les informations
     * utilisateur de la sidebar.
     */

    const sidebarUser = document.getElementById("sidebar-user");

    if (sidebarUser) {
      sidebarUser.classList.add("hidden");
    }

    /*
     * Affiche la page
     * accès non autorisé.
     */

    const page = document.getElementById("page-unauthorized");

    if (page) {
      page.classList.remove("hidden");
    }

    /*
     * Affiche l'adresse Google
     * identifiée.
     */

    const email = document.getElementById("unauthorized-email");

    if (email) {
      email.textContent = user.email || "";
    }
  }

  function showUserError(error) {
    console.error("Erreur utilisateur :", error);

    showUnauthorizedPage({
      email: "",
    });
  }

  /* =========================
   ACCES
   ========================= */

  let accessUsersLoaded = false;

  function loadAccessUsers() {
    const container = document.getElementById("access-users");

    if (!container) {
      return;
    }

    container.innerHTML = "Chargement des utilisateurs...";

    google.script.run

      .withSuccessHandler(displayAccessUsers)

      .withFailureHandler(showAccessUsersError)

      .getAccessUsers();
  }

  function displayAccessUsers(users) {
    const container = document.getElementById("access-users");

    if (!container) {
      return;
    }

    let html = `

    <table class="access-table">

      <thead>

        <tr>

          <th>
            Utilisateur
          </th>

          <th>
            Rôle
          </th>

          <th>
            Statut
          </th>

          <th>
            Actions
          </th>

        </tr>

      </thead>


      <tbody>

  `;

    users.forEach((user) => {
      const roleClass = "role-" + user.role.toLowerCase();

      const statusClass = user.actif ? "status-active" : "status-inactive";

      const statusLabel = user.actif ? "Actif" : "Inactif";

      html += `

      <tr>

        <td>

          <div class="access-user-name">
            ${user.prenom} ${user.nom}
          </div>

          <div class="access-user-email">
            ${user.email}
          </div>

        </td>


        <td>

          <span
            class="role-badge ${roleClass}"
          >
            ${user.role}
          </span>

        </td>


        <td>

          <span
            class="status-badge ${statusClass}"
          >
            ${statusLabel}
          </span>

        </td>


        <td>

          <button
            class="access-action"
            onclick='openAccessModal(${JSON.stringify(user)})'
          >
            Modifier
          </button>

        </td>

      </tr>

    `;
    });

    html += `

      </tbody>

    </table>

  `;

    container.innerHTML = html;

    accessUsersLoaded = true;
  }

  function openAccessModal(user = null) {
    const modal = document.getElementById("access-modal");

    const title = document.getElementById("access-modal-title");

    const email = document.getElementById("access-email");

    const error = document.getElementById("access-form-error");

    error.classList.add("hidden");

    error.textContent = "";

    if (user) {
      title.textContent = "Modifier l'utilisateur";

      document.getElementById("access-prenom").value = user.prenom;

      document.getElementById("access-nom").value = user.nom;

      email.value = user.email;

      /*
       * On bloque l'email lors
       * d'une modification.
       */

      email.disabled = true;

      document.getElementById("access-role").value = user.role;

      document.getElementById("access-actif").checked = user.actif;
    } else {
      title.textContent = "Ajouter un utilisateur";

      document.getElementById("access-prenom").value = "";

      document.getElementById("access-nom").value = "";

      email.value = "";

      email.disabled = false;

      document.getElementById("access-role").value = "COACH";

      document.getElementById("access-actif").checked = true;
    }

    modal.classList.remove("hidden");
  }

  function closeAccessModal() {
    document.getElementById("access-modal").classList.add("hidden");
  }

  function saveAccessUserFromForm() {
    const button = document.getElementById("access-save-button");

    const error = document.getElementById("access-form-error");

    error.classList.add("hidden");

    const user = {
      prenom: document.getElementById("access-prenom").value,

      nom: document.getElementById("access-nom").value,

      email: document.getElementById("access-email").value,

      role: document.getElementById("access-role").value,

      actif: document.getElementById("access-actif").checked,
    };

    button.disabled = true;

    button.textContent = "Enregistrement...";

    google.script.run

      .withSuccessHandler((users) => {
        button.disabled = false;

        button.textContent = "Enregistrer";

        closeAccessModal();

        displayAccessUsers(users);
      })

      .withFailureHandler((err) => {
        button.disabled = false;

        button.textContent = "Enregistrer";

        error.textContent = err.message;

        error.classList.remove("hidden");
      })

      .saveAccessUser(user);
  }

  function showAccessUsersError(error) {
    const container = document.getElementById("access-users");

    if (!container) {
      return;
    }

    container.innerHTML = `

    <div
      style="
        padding: 20px;
      "
    >

      <strong>
        Erreur :
      </strong>

      ${error.message}

    </div>

  `;
  }
  /* =========================
   ARBITRAGE
   ========================= */

  let arbitresData = [];

  /*
   * Ordre d'affichage des catégories
   * intégrées au vivier d'arbitrage.
   */
  const arbitrageCategorieOrder = [
    "U13F",
    "U13M",
    "U15F",
    "U15M",
    "U18F",
    "U18M",
    "SENIORS_F",
    "SENIORS_M",
  ];

  /*
   * Niveaux d'arbitrage.
   */
  const arbitrageNiveaux = [
    {
      value: "",
      label: "Non évalué",
    },
    {
      value: "DEBUTANT",
      label: "Débutant",
    },
    {
      value: "APPRENTISSAGE",
      label: "En apprentissage",
    },
    {
      value: "AUTONOME",
      label: "Autonome",
    },
    {
      value: "CONFIRME",
      label: "Confirmé",
    },
    {
      value: "REFERENT",
      label: "Référent",
    },
  ];

  /*
   * Libellés des types d'arbitres.
   */
  const arbitrageTypeLabels = {
    JOUEUR: "Joueur",

    CLUB: "Club",

    EXTERIEUR: "Extérieur",
  };

  function toggleArbitrageLevelHelp() {
    const button = document.getElementById("arbitrage-level-help-button");

    const help = document.getElementById("arbitrage-level-help");

    if (!button || !help) {
      return;
    }

    const isOpen = !help.hidden;

    help.hidden = isOpen;

    button.setAttribute("aria-expanded", String(!isOpen));
  }

  /**
   * Charge le référentiel arbitrage.
   */
  function loadArbitrage() {
    const loading = document.getElementById("arbitrage-loading");

    const table = document.getElementById("arbitrage-table-container");

    const empty = document.getElementById("arbitrage-empty");

    if (loading) {
      loading.style.display = "block";

      loading.textContent = "Chargement...";
    }

    if (table) {
      table.style.display = "none";
    }

    if (empty) {
      empty.style.display = "none";
    }

    google.script.run

      .withSuccessHandler(handleArbitresLoaded)

      .withFailureHandler(handleArbitrageError)

      .getArbitres("2026-2027");
  }
  function updateArbitrageStats() {
    const total = arbitresData.length;

    const evaluated = arbitresData.filter(function (arbitre) {
      return Boolean(arbitre.Niveau);
    }).length;

    const autonomousLevels = ["AUTONOME", "CONFIRME", "REFERENT"];

    const autonomous = arbitresData.filter(function (arbitre) {
      return autonomousLevels.includes(arbitre.Niveau);
    }).length;

    const external = arbitresData.filter(function (arbitre) {
      return arbitre.Type === "EXTERIEUR";
    }).length;

    const totalElement = document.getElementById("arbitrage-stat-total");

    const evaluatedElement = document.getElementById(
      "arbitrage-stat-evaluated",
    );

    const autonomousElement = document.getElementById(
      "arbitrage-stat-autonomous",
    );

    const externalElement = document.getElementById("arbitrage-stat-external");

    if (totalElement) {
      totalElement.textContent = total;
    }

    if (evaluatedElement) {
      evaluatedElement.textContent = evaluated;
    }

    if (autonomousElement) {
      autonomousElement.textContent = autonomous;
    }

    if (externalElement) {
      externalElement.textContent = external;
    }
  }

  /**
   * Réception des données.
   */
  function handleArbitresLoaded(data) {
    console.log("Données reçues getArbitres :", data);

    arbitresData = Array.isArray(data) ? data : [];

    updateArbitrageStats();
    console.log("Nombre d'arbitres chargés :", arbitresData.length);

    buildArbitrageCategoryFilter();

    filterArbitres();
  }

  /**
   * Construit le filtre catégories.
   */
  function buildArbitrageCategoryFilter() {
    const select = document.getElementById("arbitrage-filter-categorie");

    if (!select) {
      return;
    }

    const currentValue = select.value;

    const categories = [
      ...new Set(
        arbitresData

          .filter((arbitre) => arbitre.Type === "JOUEUR")

          .map((arbitre) => String(arbitre.Categorie || "").trim())

          .filter(Boolean),
      ),
    ];

    categories.sort((a, b) => {
      const indexA = arbitrageCategorieOrder.indexOf(a);

      const indexB = arbitrageCategorieOrder.indexOf(b);

      const orderA = indexA === -1 ? 999 : indexA;

      const orderB = indexB === -1 ? 999 : indexB;

      if (orderA !== orderB) {
        return orderA - orderB;
      }

      return a.localeCompare(b, "fr");
    });

    select.innerHTML = `
      <option value="">
        Toutes les catégories
      </option>
    `;

    categories.forEach((categorie) => {
      const option = document.createElement("option");

      option.value = categorie;

      option.textContent = formatArbitrageCategorie(categorie);

      select.appendChild(option);
    });

    if (categories.includes(currentValue)) {
      select.value = currentValue;
    }
  }

  /**
   * Filtre les arbitres.
   */
  function filterArbitres() {
    const type = document.getElementById("arbitrage-filter-type")?.value || "";

    const categorie =
      document.getElementById("arbitrage-filter-categorie")?.value || "";

    const niveau =
      document.getElementById("arbitrage-filter-niveau")?.value || "";

    const search = String(
      document.getElementById("arbitrage-filter-search")?.value || "",
    )
      .trim()
      .toLowerCase();

    const filtered = arbitresData

      .filter((arbitre) => !type || String(arbitre.Type || "") === type)

      .filter(
        (arbitre) =>
          !categorie || String(arbitre.Categorie || "") === categorie,
      )

      .filter((arbitre) => {
        if (!niveau) {
          return true;
        }

        const currentNiveau = String(arbitre.Niveau || "").trim();

        if (niveau === "NON_EVALUE") {
          return currentNiveau === "";
        }

        return currentNiveau === niveau;
      })

      .filter((arbitre) => {
        if (!search) {
          return true;
        }

        const identity = (
          String(arbitre.Prenom || "") +
          " " +
          String(arbitre.Nom || "")
        ).toLowerCase();

        return identity.includes(search);
      });

    displayArbitres(filtered);
  }

  /**
   * Affiche le tableau.
   */
  function displayArbitres(arbitres) {
    const loading = document.getElementById("arbitrage-loading");

    const table = document.getElementById("arbitrage-table-container");

    const body = document.getElementById("arbitrage-table-body");

    const empty = document.getElementById("arbitrage-empty");

    const summary = document.getElementById("arbitrage-summary");

    if (loading) {
      loading.style.display = "none";
    }

    if (!body) {
      return;
    }

    body.innerHTML = "";

    /*
     * =========================
     * RESUME
     * =========================
     */

    const total = arbitresData.length;

    const evaluated = arbitresData.filter(
      (arbitre) => String(arbitre.Niveau || "").trim() !== "",
    ).length;

    const joueurs = arbitresData.filter(
      (arbitre) => arbitre.Type === "JOUEUR",
    ).length;

    const club = arbitresData.filter(
      (arbitre) => arbitre.Type === "CLUB",
    ).length;

    const exterieurs = arbitresData.filter(
      (arbitre) => arbitre.Type === "EXTERIEUR",
    ).length;

    if (summary) {
      summary.textContent =
        arbitres.length +
        " arbitre(s) affiché(s)" +
        " sur " +
        total +
        " • " +
        evaluated +
        " évalué(s)" +
        " • " +
        joueurs +
        " joueur(s)" +
        " • " +
        club +
        " club" +
        " • " +
        exterieurs +
        " extérieur(s)";
    }

    /*
     * =========================
     * AUCUN RESULTAT
     * =========================
     */

    if (arbitres.length === 0) {
      if (table) {
        table.style.display = "none";
      }

      if (empty) {
        empty.style.display = "block";
      }

      return;
    }

    if (empty) {
      empty.style.display = "none";
    }

    if (table) {
      table.style.display = "block";
    }

    /*
     * =========================
     * LIGNES
     * =========================
     */

    arbitres.forEach((arbitre) => {
      const tr = document.createElement("tr");

      /*
       * =========================
       * ARBITRE
       * =========================
       */

      const arbitreTd = document.createElement("td");

      const identity =
        [arbitre.Prenom, arbitre.Nom].filter(Boolean).join(" ") || "—";

      /*
       * CLUB / EXTERIEUR :
       * le nom ouvre la fiche.
       */

      if (arbitre.Type === "CLUB" || arbitre.Type === "EXTERIEUR") {
        const nameButton = document.createElement("button");

        nameButton.type = "button";

        nameButton.textContent = identity;

        nameButton.className = "arbitrage-name-button";

        nameButton.addEventListener("click", function () {
          openArbitreEdit(arbitre);
        });

        arbitreTd.appendChild(nameButton);
      } else {
        const name = document.createElement("span");

        name.className = "arbitrage-name";

        name.textContent = identity;

        arbitreTd.appendChild(name);
      }

      /*
       * =========================
       * TYPE
       * =========================
       */

      const typeTd = document.createElement("td");

      const typeBadge = document.createElement("span");

      typeBadge.textContent =
        arbitrageTypeLabels[arbitre.Type] || arbitre.Type || "—";

      typeBadge.className = "arbitrage-badge";

      if (arbitre.Type === "JOUEUR") {
        typeBadge.classList.add("arbitrage-type-joueur");
      } else if (arbitre.Type === "CLUB") {
        typeBadge.classList.add("arbitrage-type-club");
      } else if (arbitre.Type === "EXTERIEUR") {
        typeBadge.classList.add("arbitrage-type-exterieur");
      }

      typeTd.appendChild(typeBadge);

      /*
       * =========================
       * CATEGORIE
       * =========================
       */

      const categorieTd = document.createElement("td");

      if (arbitre.Type === "JOUEUR" && arbitre.Categorie) {
        const categorieBadge = document.createElement("span");

        categorieBadge.className = "arbitrage-badge arbitrage-category-badge";

        categorieBadge.textContent = formatArbitrageCategorie(
          arbitre.Categorie,
        );

        categorieTd.appendChild(categorieBadge);
      } else {
        categorieTd.textContent = "—";
      }

      /*
       * =========================
       * LICENCE
       * =========================
       */

      const licenceTd = document.createElement("td");

      licenceTd.textContent =
        arbitre.Type === "JOUEUR" ? arbitre.Licence_ffbb || "—" : "—";

      /*
       * =========================
       * NIVEAU
       * =========================
       */

      const niveauTd = document.createElement("td");

      const select = document.createElement("select");

      select.className = "arbitrage-level-select";

      arbitrageNiveaux.forEach((niveau) => {
        const option = document.createElement("option");

        option.value = niveau.value;

        option.textContent = niveau.label;

        if (niveau.value === String(arbitre.Niveau || "")) {
          option.selected = true;
        }

        select.appendChild(option);
      });

      /*
       * Couleur initiale du niveau.
       */

      applyArbitrageLevelStyle(select);

      select.addEventListener("change", function () {
        /*
         * On change immédiatement
         * la couleur dans l'interface.
         */

        applyArbitrageLevelStyle(select);

        /*
         * Puis on sauvegarde.
         */

        saveArbitreNiveauFromUI(arbitre, select);
      });

      niveauTd.appendChild(select);

      /*
       * =========================
       * AJOUT DES CELLULES
       * =========================
       */

      tr.appendChild(arbitreTd);

      tr.appendChild(typeTd);

      tr.appendChild(categorieTd);

      tr.appendChild(licenceTd);

      tr.appendChild(niveauTd);

      body.appendChild(tr);
    });
  }
  function applyArbitrageLevelStyle(select) {
    if (!select) {
      return;
    }

    const levelClasses = [
      "arbitrage-level-none",
      "arbitrage-level-debutant",
      "arbitrage-level-apprentissage",
      "arbitrage-level-autonome",
      "arbitrage-level-confirme",
      "arbitrage-level-referent",
    ];

    select.classList.remove(...levelClasses);

    const niveau = String(select.value || "").trim();

    switch (niveau) {
      case "DEBUTANT":
        select.classList.add("arbitrage-level-debutant");

        break;

      case "APPRENTISSAGE":
        select.classList.add("arbitrage-level-apprentissage");

        break;

      case "AUTONOME":
        select.classList.add("arbitrage-level-autonome");

        break;

      case "CONFIRME":
        select.classList.add("arbitrage-level-confirme");

        break;

      case "REFERENT":
        select.classList.add("arbitrage-level-referent");

        break;

      default:
        select.classList.add("arbitrage-level-none");
    }
  }

      saveButton.textContent = "Enregistrement...";

        closeArbitreEdit();

          deleteButton.disabled = false;

        const message =

        showArbitreEditMessage(message, true);

  /**
   * Supprime un arbitre
   * CLUB / EXTERIEUR.
   */
  function deleteArbitreFromUI() {
    const arbitreId = String(
      document.getElementById("arbitrage-edit-id")?.value || "",
    ).trim();

    const prenom = String(
      document.getElementById("arbitrage-edit-prenom")?.value || "",
    ).trim();

    const nom = String(
      document.getElementById("arbitrage-edit-nom")?.value || "",
    ).trim();

    if (!arbitreId) {
      showArbitreEditMessage("Identifiant arbitre manquant.", true);

      return;
    }

    const identity = [prenom, nom].filter(Boolean).join(" ") || "cet arbitre";

    /*
     * Confirmation volontairement
     * explicite car l'action est
     * destructive.
     */

    const confirmed = window.confirm(
      "Supprimer " +
        identity +
        " du vivier d'arbitrage ?\n\n" +
        "Cette action est définitive.",
    );

    if (!confirmed) {
      return;
    }

    const saveButton = document.getElementById("arbitrage-edit-save");

    const deleteButton = document.getElementById("arbitrage-edit-delete");

    if (saveButton) {
      saveButton.disabled = true;
    }

    if (deleteButton) {
      deleteButton.disabled = true;

      deleteButton.textContent = "Suppression...";
    }

    google.script.run

      .withSuccessHandler((result) => {
        if (deleteButton) {
          deleteButton.disabled = false;

          deleteButton.textContent = "Supprimer l'arbitre";
        }

        if (saveButton) {
          saveButton.disabled = false;
        }

        closeArbitreEdit();

        loadArbitrage();
      })

      .withFailureHandler((error) => {
        if (deleteButton) {
          deleteButton.disabled = false;

          deleteButton.textContent = "Supprimer l'arbitre";
        }

        if (saveButton) {
          saveButton.disabled = false;
        }

        const message =
          error?.message || String(error) || "Une erreur est survenue.";

        showArbitreEditMessage(message, true);
      })

      .deleteArbitreExterne(arbitreId);
  }

  /**
   * Sauvegarde un changement
   * de niveau d'arbitrage.
   *
   * JOUEUR :
   * sauvegarde via Contact_id.
   *
   * CLUB / EXTERIEUR :
   * sauvegarde via Arbitre_id.
   */
  function saveArbitreNiveauFromUI(arbitre, select) {
    const previousValue = String(arbitre.Niveau || "");

    const newValue = select.value;

    select.disabled = true;

    const handleSuccess = (result) => {
      /*
       * Mise à jour des données locales
       * uniquement après confirmation
       * du serveur.
       */

      arbitre.Niveau = newValue;

      if (result && result.Arbitre_id) {
        arbitre.Arbitre_id = result.Arbitre_id;
      }

      select.disabled = false;

      /*
       * Recalcul des indicateurs
       * du haut de page.
       */

      updateArbitrageStats();

      /*
       * Réapplication des filtres
       * et rafraîchissement du tableau.
       */

      filterArbitres();
    };

    const handleFailure = (error) => {
      /*
       * Retour à l'ancienne valeur.
       */

      select.value = previousValue;

      /*
       * Retour également à
       * l'ancienne couleur.
       */

      applyArbitrageLevelStyle(select);

      select.disabled = false;

      handleArbitrageError(error);
    };

    /*
     * =========================
     * JOUEUR
     * =========================
     */

    if (arbitre.Type === "JOUEUR") {
      google.script.run

        .withSuccessHandler(handleSuccess)

        .withFailureHandler(handleFailure)

        .saveArbitreNiveau(arbitre.Contact_id, "2026-2027", newValue);

      return;
    }

    /*
     * =========================
     * CLUB / EXTERIEUR
     * =========================
     */

    if (arbitre.Type === "CLUB" || arbitre.Type === "EXTERIEUR") {
      if (!arbitre.Arbitre_id) {
        handleFailure(new Error("Identifiant arbitre manquant."));

        return;
      }

      google.script.run

        .withSuccessHandler(handleSuccess)

        .withFailureHandler(handleFailure)

        .saveArbitreExterneNiveau(arbitre.Arbitre_id, newValue);

      return;
    }

    /*
     * =========================
     * TYPE INCONNU
     * =========================
     */

    handleFailure(new Error("Type d'arbitre non reconnu."));
  }

    const labels = {

    return labels[categorie] || categorie || "—";

   */

    console.error("Erreur Arbitrage :", error);

    const loading = document.getElementById("arbitrage-loading");

    const message =
      error?.message || String(error) || "Une erreur est survenue.";

    if (loading) {
      loading.style.display = "block";

      loading.innerHTML = `

        ${escapeHtml(message)}
      `;
    }
  }

  /**

   */
  function loadAssoConnectExports() {
    if (assoConnectImportRunning) {
      return;
    }

    const loading = document.getElementById("assoconnect-import-loading");

    const content = document.getElementById("assoconnect-import-content");

    const error = document.getElementById("assoconnect-import-error");

    const result = document.getElementById("assoconnect-import-result");

    if (!loading || !content) {
      return;
    }

    loading.textContent = "Chargement des exports...";

    content.style.display = "none";

    if (error) {
      error.style.display = "none";

      error.textContent = "";
    }

    if (result) {
      result.style.display = "none";

      result.textContent = "";
    }

    google.script.run

      .withSuccessHandler(displayAssoConnectExports)

      .withFailureHandler(showAssoConnectImportError)

      .getAssoConnectExports("2026-2027");

  /**
   * Affiche les fichiers AssoConnect.
   */
  function displayAssoConnectExports(exports) {

  /**
   * Contrôle les types sélectionnés
   * puis lance réellement l'import.
   */
  function prepareAssoConnectImport() {
    if (assoConnectImportRunning) {
      return;
    }

    const files = [];

    const errorDiv = document.getElementById("assoconnect-import-error");

    const resultDiv = document.getElementById("assoconnect-import-result");

    if (errorDiv) {
      errorDiv.style.display = "none";

      errorDiv.textContent = "";
    }

    if (resultDiv) {
      resultDiv.style.display = "none";

      resultDiv.textContent = "";
    }

    if (!assoConnectExports || assoConnectExports.length === 0) {
      showAssoConnectImportError({
        message: "Aucun export AssoConnect à importer.",
      });

      return;
    }

    for (const file of assoConnectExports) {
      /*
       * Les fichiers vides
       * ne sont pas importés.
       */

      if (file.type === "VIDE") {
        continue;
      }

      /*
       * Export validé.
       */

      if (file.type === "VALIDE") {
        files.push({
          id: file.id,

          type: "VALIDE",
        });

        continue;
      }

      /*
       * Export non validé :
       * choix manuel obligatoire.
       */

      const select = document.querySelector(
        `select[data-file-id="${file.id}"]`,
      );

      if (!select || !select.value) {
        showAssoConnectImportError({
          message: "Merci de sélectionner le type de chaque export.",
        });

        return;
      }

      files.push({
        id: file.id,

        type: select.value,
      });
    }

    if (files.length === 0) {
      showAssoConnectImportError({
        message: "Aucun fichier exploitable à importer.",
      });

      return;
    }

    runAssoConnectImport(files);
  }

  /**
   * Lance réellement l'import

    const resultDiv = document.getElementById("assoconnect-import-result");

    const errorDiv = document.getElementById("assoconnect-import-error");

    assoConnectImportRunning = true;

    if (button) {
      button.disabled = true;

      errorDiv.style.display = "none";

      errorDiv.textContent = "";
    }

    google.script.run

      .withSuccessHandler(handleAssoConnectImportSuccess)

      .withFailureHandler(handleAssoConnectImportFailure)

      .importAssoConnect("2026-2027", files);
  }

  /**
   * Lance l'import FBI puis
   * la synchronisation avec
   * Contacts / Adhesions.
   */
  function synchronizeFbiImport() {
    if (fbiImportRunning) {
      return;
    }

    if (!fbiExports || fbiExports.length === 0) {
      showFbiImportError({
        message: "Aucun export FBI à synchroniser.",
      });

      return;
    }

    const hasPreinscription = fbiExports.some(
      (file) => file.type === "PREINSCRIPTION",
    );

    const hasLicence = fbiExports.some((file) => file.type === "LICENCE");

    /*
     * On exige les deux sources
     * pour éviter de remplacer
     * le cache FBI avec un export
     * incomplet.
     */

    if (!hasPreinscription || !hasLicence) {
      showFbiImportError({
        message:
          "Les exports Préinscriptions et Licences sont tous les deux nécessaires.",
      });

      return;
    }

    const button = document.getElementById("fbi-import-button");

    const result = document.getElementById("fbi-import-result");

    const error = document.getElementById("fbi-import-error");

    fbiImportRunning = true;

    if (button) {
      button.disabled = true;

      button.textContent = "Synchronisation...";
    }

    if (error) {
      error.style.display = "none";

      error.textContent = "";
    }

    if (result) {
      result.style.display = "block";

      result.textContent = "Lecture et import des exports FBI...";
    }

    /*
     * Etape 1 :
     * reconstruction du cache Import_FBI.
     */

    google.script.run

      .withSuccessHandler(handleFbiImportSuccess)

      .withFailureHandler(handleFbiImportFailure)

      .importFbi("2026-2027");
  }

  /**
   * Remplit automatiquement
   * le filtre multi-catégories.
   */
  function populateAdhesionCategories() {
    const options = document.getElementById(
      "adhesions-category-filter-options",
    );

    if (!options) {
      return;
    }

    const previousSelection = new Set(getSelectedAdhesionCategories());

    const categories = [
      ...new Set(
        adhesionsData.map((adhesion) => adhesion.Categorie).filter(Boolean),
      ),
    ];

    categories.sort((a, b) =>
      a.localeCompare(b, "fr", {
        numeric: true,
      }),
    );

    options.innerHTML = "";

    categories.forEach((categorie) => {
      const label = document.createElement("label");

      label.className = "adhesion-category-option";

      const checkbox = document.createElement("input");

      checkbox.type = "checkbox";

      checkbox.value = categorie;

      checkbox.checked = previousSelection.has(categorie);

      checkbox.addEventListener("change", () => {
        updateAdhesionCategoryFilterLabel();

        filterAdhesions();
      });

      const text = document.createElement("span");

      text.textContent = categorie;

      label.appendChild(checkbox);

      label.appendChild(text);

      options.appendChild(label);
    });

    updateAdhesionCategoryFilterLabel();
  }

  function isCancelledAdhesion(adhesion) {
    return String(adhesion?.Statut_adhesion || "ACTIVE").trim() === "ANNULEE";
  }

  function isActiveAdhesion(adhesion) {
    return !isCancelledAdhesion(adhesion);
  }

  /**
   * Construit le dashboard
   * de progression.
   */
  function displayAdhesionsDashboard() {
    const container = document.getElementById("adhesions-dashboard");

    const loading = document.getElementById("adhesions-dashboard-loading");

    if (!container) {
      return;
    }

    if (loading) {
      loading.style.display = "none";
    }

    const activeAdhesions = (adhesionsData || []).filter(isActiveAdhesion);

    if (activeAdhesions.length === 0) {
      container.innerHTML = `
        <div class="adhesion-dashboard-empty">
          Aucune adhésion active.
        </div>
      `;

      container.style.display = "block";

      return;
    }

    /*
     * Catégories.
     */

    const categories = {};

    activeAdhesions.forEach((adhesion) => {
      const categorie = adhesion.Categorie || "Sans catégorie";

      if (!categories[categorie]) {
        categories[categorie] = [];
      }

      categories[categorie].push(adhesion);
    });

    /*
     * Tri naturel :
     * U7, U9, U11...
     */

    const categoryNames = Object.keys(categories);

    categoryNames.sort((a, b) =>
      a.localeCompare(b, "fr", {
        numeric: true,
      }),
    );

    /*
     * Ligne TOTAL.
     */

    const totalStats = calculateAdhesionDashboardStats(activeAdhesions);

    let html = `
      ${renderAdhesionDashboardRow("TOTAL", "", totalStats, true)}

      <div
        class="adhesion-dashboard-separator"
      >
      </div>
    `;

    /*
     * Lignes catégories.
     */

    categoryNames.forEach((categorie) => {
      const stats = calculateAdhesionDashboardStats(categories[categorie]);

      html += renderAdhesionDashboardRow(categorie, categorie, stats, false);
    });

    container.innerHTML = html;

    container.style.display = "block";

    updateAdhesionDashboardSelection();
  }

  /**
   * Calcule les statistiques
   * d'un ensemble d'adhésions.
   *
   * Le pourcentage est basé sur
   * les contrôles administratifs,
   * pas sur une moyenne des
   * pourcentages individuels.
   */
  function calculateAdhesionDashboardStats(adhesions) {
    let controlesValides = 0;

    let controlesTotal = 0;

    let terminees = 0;

    adhesions.forEach((adhesion) => {
      controlesValides += Number(adhesion.Suivi_controles_valides || 0);

      controlesTotal += Number(adhesion.Suivi_controles_total || 0);

      if (adhesion.Suivi_statut === "OK") {
        terminees++;
      }
    });

    const progression =
      controlesTotal > 0
        ? Math.round((controlesValides / controlesTotal) * 100)
        : 0;

    return {
      progression: progression,

      terminees: terminees,

      total: adhesions.length,

      controlesValides: controlesValides,

      controlesTotal: controlesTotal,
    };
  }

  /**
   * Génère une ligne du dashboard.
   */
  function renderAdhesionDashboardRow(label, category, stats, isTotal) {
    const progression = Math.max(
      0,
      Math.min(100, Number(stats.progression || 0)),
    );

    const complete = progression === 100;

    return `
    <button
      type="button"
      class="
        adhesion-dashboard-row
        ${isTotal ? "adhesion-dashboard-total" : ""}
      "
      data-category="${escapeHtml(category)}"
      onclick="filterAdhesionsFromDashboard('${escapeJs(category)}')"
    >

      <div
        class="adhesion-dashboard-category"
      >

        ${escapeHtml(label)}

      </div>


      <div
        class="adhesion-dashboard-progress"
      >

        <div
          class="adhesion-dashboard-progress-track"
        >

          <div
            class="
              adhesion-dashboard-progress-value
              ${complete ? "complete" : ""}
            "
            style="

  /**

   * une ligne du dashboard.
   */
  function filterAdhesionsFromDashboard(category) {
    const options = document.getElementById(
      "adhesions-category-filter-options",
    );

    if (!options) {
      return;
    }

    options.querySelectorAll('input[type="checkbox"]').forEach((input) => {
      input.checked = category ? input.value === category : false;
    });

    updateAdhesionCategoryFilterLabel();

    filterAdhesions();

    updateAdhesionDashboardSelection();
  }

  /**
   * Met visuellement en évidence
   * les catégories actuellement
   * sélectionnées.
   */
  function updateAdhesionDashboardSelection() {
    const selectedCategories = getSelectedAdhesionCategories();

    document.querySelectorAll(".adhesion-dashboard-row").forEach((row) => {
      const category = row.dataset.category;

      row.classList.toggle(
        "selected",
        category === ""
          ? selectedCategories.length === 0
          : selectedCategories.includes(category),
      );
    });
  }

  /**
   * Filtre le tableau.
   */
  function filterAdhesions() {
    const searchInput = document.getElementById("adhesions-search");

    const statusInput = document.getElementById("adhesions-status-filter");

    const cancelledInput = document.getElementById(
      "adhesions-cancelled-toggle",
    );

    if (!searchInput || !statusInput || !cancelledInput) {
      return;
    }

    const search = searchInput.value.trim().toLowerCase();

    const categories = getSelectedAdhesionCategories();

    const status = statusInput.value;

    const lifecycle = cancelledInput.checked ? "ANNULEE" : "ACTIVE";

    const filtered = adhesionsData.filter((adhesion) => {
      const identity = (adhesion.Prenom + " " + adhesion.Nom).toLowerCase();

      if (search && !identity.includes(search)) {
        return false;
      }

      if (categories.length > 0 && !categories.includes(adhesion.Categorie)) {
        return false;
      }

      if (status && adhesion.Suivi_statut !== status) {
        return false;
      }

      const adhesionStatus = String(
        adhesion.Statut_adhesion || "ACTIVE",
      ).trim();

      if (adhesionStatus !== lifecycle) {
        return false;
      }

      return true;
    });

    displayAdhesions(filtered);

    displayAdhesionsSummary(filtered);

    updateAdhesionDashboardSelection();
  }

  /**
   * Envoie l'image filtrée en pièce jointe.
   */
  async function sendAdhesionsTableEmail() {
    const recipient = String(
      document.getElementById("adhesion-export-recipient")?.value || "",
    ).trim();

    const subject = String(
      document.getElementById("adhesion-export-subject")?.value || "",
    ).trim();

    const body = String(
      document.getElementById("adhesion-export-body")?.value || "",
    ).trim();

    const error = document.getElementById("adhesion-export-email-error");

    const status = document.getElementById("adhesion-export-email-status");

    const button = document.getElementById("adhesion-export-email-send");

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(recipient)) {
      error.textContent = "Saisissez une adresse email valide.";

      error.style.display = "block";

      return;
    }

    if (!subject) {
      error.textContent = "L'objet de l'email est obligatoire.";

      error.style.display = "block";

      return;
    }

    try {
      const table = getAdhesionsExportTable();

      button.disabled = true;

      status.style.display = "block";

      error.style.display = "none";

      await USABExport.sendElementImageByEmail(table, {
        recipient: recipient,
        subject: subject,
        body: body,
        fileName: getAdhesionsExportFileName(),
      });

      closeAdhesionEmailExport();

      alert("Email envoyé avec l'image du tableau en pièce jointe.");
    } catch (sendError) {
      error.textContent = sendError.message || sendError;

      error.style.display = "block";
    } finally {
      button.disabled = false;

      status.style.display = "none";
    }
  }

          : "Non déclaré dans AssoConnect"
      }"
    >

      <option
        value=""
        ${normalized === "" ? "selected" : ""}
      >
        À renseigner
      </option>

      <option
        value="OUI"

      </option>

      <option
        value="NON"

  /**
   * Classe visuelle d'un statut
   * tri-état.
   */
  function getTriStateSelectClass(value) {
    if (value === "OUI") {
      return "adhesion-quick-success";
    }

    if (value === "NON") {
      return "adhesion-quick-danger";
    }

    if (value === "NA") {
      return "adhesion-quick-neutral";
    }

    return "adhesion-quick-warning";
  }

  /**
   * Sauvegarde immédiate d'un
   * champ depuis le tableau.
   */
  function saveQuickAdhesionField(select) {
    const adhesionId = select.dataset.adhesionId;

    const field = select.dataset.field;

    const previousValue = select.dataset.previousValue;

    const newValue = select.value;

    if (!adhesionId || !field || newValue === previousValue) {
      return;
    }

    const data = {};

    data[field] = newValue;

    /*
     * Si on marque la caution
     * comme donnée, les deux
     * chèques sont considérés reçus.
     *
     * Inversement NON = 0.
     */

    if (field === "Caution_arbitrage_statut") {
      if (newValue === "OUI") {
        data.Cautions_arbitrage_recues = 2;
      } else if (newValue === "NON" || newValue === "NA") {
        data.Cautions_arbitrage_recues = 0;
      }
    }

    select.disabled = true;

    select.classList.add("adhesion-quick-saving");

    google.script.run

      .withSuccessHandler(() => {
        select.dataset.previousValue = newValue;

        select.disabled = false;

        select.classList.remove("adhesion-quick-saving");

        refreshAdhesions();
      })

      .withFailureHandler((err) => {
        select.value = previousValue;

        select.disabled = false;

        select.classList.remove("adhesion-quick-saving");

        alert("Impossible d'enregistrer : " + (err.message || err));
      })

      .saveAdhesionFollowUp(adhesionId, data);
  }

  /**
   * Annule ou réactive l'adhésion
   * affichée dans le sidepanel.
   */
  function toggleCurrentAdhesionStatus() {
    if (!currentAdhesionId) {
      return;
    }

    const adhesion = adhesionsData.find(
      (item) => item.Adhesion_id === currentAdhesionId,
    );

    if (!adhesion) {
      return;
    }

    const cancelled = isCancelledAdhesion(adhesion);

    const targetStatus = cancelled ? "ACTIVE" : "ANNULEE";

    const identity =
      [adhesion.Prenom, adhesion.Nom].filter(Boolean).join(" ") ||
      "cette adhésion";

    const confirmation = cancelled
      ? "Réactiver l'adhésion de " + identity + " ?"
      : "Annuler l'adhésion de " +
        identity +
        " ?\n\n" +
        "Elle sera conservée mais masquée de la liste active.";

    if (!window.confirm(confirmation)) {
      return;
    }

    const button = document.getElementById("adhesion-detail-status-action");

    const saving = document.getElementById("adhesion-detail-saving");

    const error = document.getElementById("adhesion-detail-error");

    if (button) {
      button.disabled = true;
    }

    if (saving) {
      saving.textContent =
        targetStatus === "ANNULEE"
          ? "Annulation en cours..."
          : "Réactivation en cours...";

      saving.style.display = "block";
    }

    if (error) {
      error.style.display = "none";

      error.textContent = "";
    }

    google.script.run
      .withSuccessHandler(() => {
        closeAdhesionDetail();

        refreshAdhesions();
      })
      .withFailureHandler((serverError) => {
        if (button) {
          button.disabled = false;
        }

        if (saving) {
          saving.style.display = "none";
        }

        if (error) {
          error.textContent = serverError.message || serverError;

          error.style.display = "block";
        }
      })
      .setAdhesionStatus(currentAdhesionId, targetStatus);
  }

  /**
